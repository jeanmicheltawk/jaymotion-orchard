<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c140e">
<title>Orchard Ideas</title>
<meta name="description" content="Orchard: drop your ideas, star them, pick your best 6. By Jay Motion.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23efc56b'/%3E%3Cpath d='M16 7c5 3 6 9 2 15-1 2-3 3-4 3 0-6 1-12 2-18z' fill='%230c140e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* VOICE simple everyday notebook, calm and premium
   IDEA a seed box on a vineyard: drop ideas in, star them, pick the best 6
   PICTURE a dimmed aerial field behind one glass column
   COLOUR deep vine green, glass olive, harvest gold
   TYPE Instrument Serif title + Manrope
   LAYOUT one centred column, same on phone and laptop */
:root{color-scheme:dark;--bg:#0c140e;--glass:rgba(20,33,22,.78);--soft:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--ink:#eef2e8;--mute:#a3b39f;--dim:#73836f;--gold:#efc56b;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#bg{position:fixed;inset:0;width:100%;height:100%;filter:brightness(.38) blur(2px);transform:scale(1.03);z-index:-1}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 60px}
header{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--gold);display:grid;place-items:center}
.logo b{color:var(--gold)}
header .sp{flex:1}
.biz{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;max-width:190px;outline:none}
.biz option{background:#132015}
.cloud{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--dim);position:relative}
.cloud::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--c,#73836f)}
h1{font:400 clamp(40px,10vw,56px)/1 'Instrument Serif',serif;margin:34px 0 4px}
.count{color:var(--mute);margin:0 0 20px}
.count b{color:var(--gold)}
.add{display:flex;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .2s}
.add:focus-within{border-color:var(--gold)}
.add input{flex:1;background:none;border:0;outline:none;padding:0 12px;font-size:16px;min-height:46px}
.add input::placeholder{color:var(--dim)}
.plant{border:0;border-radius:15px;background:var(--gold);color:#16200f;font-weight:800;padding:0 18px;min-height:46px;transition:transform .15s}
.plant:active{transform:scale(.94)}
.shop{margin:22px 0 8px}
.shop h2{font-size:14px;font-weight:700;color:var(--mute);margin:0 0 10px;display:flex;justify-content:space-between}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{height:8px;border-radius:8px;background:rgba(255,255,255,.1);transition:background .4s}
.slot.on{background:var(--gold);box-shadow:0 0 12px rgba(239,197,107,.5)}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.picked span{background:rgba(239,197,107,.15);color:var(--gold);font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;animation:pop .4s var(--ease)}
.dash{margin:18px 0 0;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--soft);border-radius:14px;padding:8px 12px}
.stats b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stats small{color:var(--mute);font-size:12.5px}
.cats{display:grid;gap:7px}
.cb{display:grid;grid-template-columns:96px minmax(0,1fr) 22px;gap:10px;align-items:center;border:0;background:none;padding:2px 0;font-size:13.5px;text-align:left;border-radius:8px}
.cb .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.cb .tr i{display:block;height:100%;border-radius:8px;background:var(--c);width:0;transition:width .9s var(--ease)}
.cb b{text-align:right;font-variant-numeric:tabular-nums}
.cb.dim{opacity:.35}
.ctag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);padding:2px 9px;border-radius:999px;margin-top:6px}
.ctag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--mute)}
.catpick button.on{background:var(--c);color:#132015;border-color:transparent}
.group{margin-top:16px}
.group h3{font-size:14px;color:var(--gold);margin:0 0 8px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:6px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chk i{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--dim);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;color:#16200f;transition:.2s}
.chk.on i{background:var(--gold);border-color:var(--gold);animation:pop .3s var(--ease)}
.chk.on span{color:var(--dim);text-decoration:line-through}
.chk small{display:block;color:var(--dim);font-size:12.5px;text-decoration:none}
.miss{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--soft);margin-bottom:6px}
.miss span{flex:1;font-size:14.5px}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8fd07a,var(--gold));transition:width .8s var(--ease)}
.tabs{display:flex;gap:6px;margin:22px 0 12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:#132015;border-color:transparent}
.list{display:grid;gap:8px}
.idea{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .45s var(--ease) both;transition:border-color .25s}
.idea.pk{border-color:rgba(239,197,107,.55)}
.idea.new{animation:rise .45s var(--ease) both,flash 1.4s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--gold)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.row{display:flex;align-items:center;gap:10px}
.title{flex:1;font-weight:700;font-size:16px;line-height:1.3;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.pick{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--dim);display:grid;place-items:center;transition:.2s}
.pick.on{background:var(--gold);color:#16200f;border-color:transparent;animation:pop .35s var(--ease)}
.note{color:var(--mute);font-size:14px;margin:4px 0 0;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{display:flex;gap:2px;margin-top:6px}
.stars button{border:0;background:none;padding:2px;font-size:19px;line-height:1;color:rgba(255,255,255,.18);transition:transform .15s,color .2s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.35)}
.edit{display:grid;gap:8px;margin-top:10px}
.in{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:76px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.btn.gold{background:var(--gold);color:#16200f;border-color:transparent}
.btn.red{color:#f0a27a}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:30px}
.foot a{color:var(--mute)}
.sheet{position:fixed;left:50%;bottom:16px;width:min(520px,calc(100% - 24px));transform:translate(-50%,130%);background:rgba(17,28,19,.97);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:10px;transition:transform .4s var(--ease),visibility 0s .4s;visibility:hidden;z-index:10}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s var(--ease)}
.sheet h3{margin:0;font:400 28px/1 'Instrument Serif',serif}
.sheet p{margin:0;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:#132015;border-radius:999px;padding:7px 7px 7px 16px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;transition:.35s var(--ease);z-index:11;max-width:calc(100% - 24px)}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:#132015;color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="wrap">
  <header>
    <div class="logo"><i><svg width="15" height="15" viewBox="0 0 32 32"><path d="M16 4c6 4 7 11 2 19-1 2-3 4-5 4 0-8 1-15 3-23z" fill="#16200f"/></svg></i><span>Orchard<b>.</b></span></div>
    <span class="sp"></span>
    <select class="biz" id="biz" aria-label="Business"></select>
    <button class="cloud" id="cloudBtn" aria-label="Cloud sync"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a5 5 0 01-.6-10A6 6 0 0118 9a4.5 4.5 0 01-1 9z"/></svg></button>
  </header>

  <h1 id="name"></h1>
  <p class="count" id="count"></p>

  <form class="add" id="addForm">
    <input id="newIdea" placeholder="Drop an idea…" autocomplete="off" aria-label="New idea">
    <button class="plant" type="submit">Add</button>
  </form>

  <section class="dash" aria-label="Dashboard">
    <div class="stats"><div><b id="sIdeas">0</b><small>ideas</small></div><div><b id="sPicked">0</b><small>picked</small></div><div><b id="sReady">0%</b><small>ready to open</small></div></div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="shop">
    <h2><span>My shop · best 6</span><span id="pickN">0/6</span></h2>
    <div class="slots" id="slots"></div>
    <div class="picked" id="picked"></div>
  </section>

  <div class="tabs"><button class="on" data-tab="all">All ideas</button><button data-tab="picked">Picked</button><button data-tab="open">Before opening</button></div>
  <div class="list" id="list"></div>

  <p class="foot">Tap ★ to rate · tap ✓ to pick · tap an idea to edit or change its category<br><a href="https://jaymotion.tech" target="_blank" rel="noopener">made by Jay Motion</a></p>
</main>

<div class="sheet" id="sheet" role="dialog" aria-label="Cloud sync">
  <h3>Cloud sync</h3>
  <p id="cloudTxt">Enter your passcode to sync ideas between phone and laptop.</p>
  <input class="in" id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
  <div class="acts"><button class="btn red" id="logout">Disconnect</button><span style="display:flex;gap:8px"><button class="btn" id="closeSheet">Close</button><button class="btn gold" id="connect">Connect</button></span></div>
  <div class="acts" style="border-top:1px solid var(--line);padding-top:10px"><button class="btn" id="newBiz">+ New business</button><button class="btn red" id="delBiz">Delete this business</button></div>
</div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">Undo</button></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='orchard.v1',MAX=6;
const CATS={concept:['Concept','#efc56b'],food:['Food & drinks','#8fd07a'],addon:['Add-on','#7cc7c0'],event:['Events','#d79be0'],mkt:['Marketing','#f0a27a'],other:['Other','#b9c3ad']};
const CHECK=[
 ['Papers',[['reg','Register the company or trade name','Ask an accountant which structure fits you.'],['mot','Ministry of Tourism restaurant license','Restaurants in Lebanon are licensed as tourism establishments.'],['muni','Jounieh municipality permit and fees',''],['staff','Staff health certificates and NSSF registration',''],['acc','Hire an accountant and register for tax','']]],
 ['Place',[['loc','Location with parking and people passing by','Jounieh traffic and parking decide a lot.'],['lease','Lease checked by a lawyer before signing',''],['power','Backup power: generator or solar','Electricity is one of the biggest costs for Lebanese restaurants.'],['safety','Gas, ventilation, water and fire safety','']]],
 ['Money',[['budget','Full budget plus 6 months of running costs saved',''],['costing','Cost every dish before setting prices','Know your profit on each plate.'],['pay','Payments: cash USD, card, Whish/OMT','']]],
 ['Team & suppliers',[['team','Chef and staff hired and trained',''],['supp','Two suppliers for every key ingredient','So a shortage never stops the kitchen.']]],
 ['Launch',[['brand','Name, logo, menu and website','Jay Motion can make the interactive menu.'],['maps','Instagram page and Google Maps listing',''],['deliv','Delivery apps (e.g. Toters)',''],['soft','Soft opening for friends and family first','Fix mistakes before the public sees them.']]]
];
const MISSED=[['Breakfast or weekend brunch','food'],['Kids menu','food'],['Loyalty card: 10th meal free','mkt'],['Catering for parties and events','addon'],['Family meal boxes','food'],['Packaging that keeps food good for delivery','addon'],['Outdoor seating with a view','concept'],['Lunch combo for offices nearby','food']];

function example(){
 const f={id:'jounieh',name:'Jounieh restaurant'};
 const d=(title,note,stars,cat)=>({id:uid(),field:f.id,title,note,stars,cat,harvest:false,created:Date.now()-Math.random()*1e8});
 return {v:2,cur:f.id,fields:[f],ideas:[
  d('Smash burger shop','Crispy smash burgers, short menu done perfectly.',4,'concept'),
  d('Healthy restaurant','Healthy burgers, baguette sandwiches and a salad bar.',4,'concept'),
  d('Açaí and fresh juice bar','Açaí bowls, smoothies and fresh juices.',3,'food'),
  d('Vending machines next to the shop','Ready-to-go salads and healthy snacks, open 24/7.',3,'addon'),
  d('DJ night once a week','One night a week the shop turns into a hangout.',4,'event')
 ]};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.fields||!S.ideas)S=example();
function fix(){S.checks=S.checks||{};S.ideas.forEach(i=>{if(i.stars==null)i.stars=3;if(!CATS[i.cat])i.cat=guess(i.title)})}
function guess(t){t=(t||'').toLowerCase();if(/dj|night|music|event|party/.test(t))return'event';if(/vending|delivery|catering|machine/.test(t))return'addon';if(/insta|loyal|game|reel|ads?\b/.test(t))return'mkt';if(/shop|restaurant|bar|kitchen|cafe|café/.test(t))return'concept';if(/menu|burger|juice|salad|bowl|food|brunch/.test(t))return'food';return'other'}
fix();
let catF='',tab='all',openId=null,newId=null,saveT,pushT,ckey='';
try{ckey=localStorage.getItem('orchard.key')||''}catch(e){}

const field=()=>S.fields.find(f=>f.id===S.cur)||S.fields[0];
const mine=()=>S.ideas.filter(i=>i.field===field().id);
function save(){S.updatedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150);if(ckey){setCloud('#efc56b');clearTimeout(pushT);pushT=setTimeout(push,1200)}}

/* cloud */
function setCloud(c){$('#cloudBtn').style.setProperty('--c',c)}
const api=(m,b)=>fetch('/api/data',{method:m,headers:{'x-orchard-key':ckey,'content-type':'application/json'},body:b?JSON.stringify(b):undefined,cache:'no-store'});
async function push(){try{const r=await api('PUT',S);setCloud(r.ok?'#8fd07a':'#f0a27a')}catch(e){setCloud('#f0a27a')}}
async function pull(first){if(!ckey){setCloud('#73836f');return}try{const r=await api('GET');if(r.status===401){setCloud('#f0a27a');return 'bad'}if(r.status===404){await push();return 'ok'}const d=await r.json();if(d.fields&&d.ideas&&(first||(d.updatedAt||0)>(S.updatedAt||0))){S=d;fix();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else if((S.updatedAt||0)>(d.updatedAt||0))await push();setCloud('#8fd07a');return 'ok'}catch(e){setCloud('#f0a27a');return 'off'}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!openId)pull()});

/* render */
function render(){
 const f=field(),L=mine(),P=L.filter(i=>i.harvest);
 $('#biz').innerHTML=S.fields.map(x=>`<option value="${esc(x.id)}"${x.id===f.id?' selected':''}>${esc(x.name)}</option>`).join('');
 $('#name').textContent=f.name;
 $('#count').innerHTML=`${L.length} idea${L.length===1?'':'s'} · <b>${P.length} picked</b>`;
 $('#pickN').textContent=`${P.length}/${MAX}`;
 const ck=S.checks[f.id]||{},total=CHECK.reduce((a,g)=>a+g[1].length,0),done=CHECK.reduce((a,g)=>a+g[1].filter(c=>ck[c[0]]).length,0),ready=Math.round(done/total*100);
 $('#sIdeas').textContent=L.length;$('#sPicked').textContent=`${P.length}/${MAX}`;$('#sReady').textContent=ready+'%';
 const mx=Math.max(1,...Object.keys(CATS).map(k=>L.filter(i=>i.cat===k).length));
 $('#cats').innerHTML=Object.entries(CATS).map(([k,[n,c]])=>{const v=L.filter(i=>i.cat===k).length;return `<button class="cb${catF&&catF!==k?' dim':''}" data-catf="${k}" style="--c:${c}" aria-label="Show ${n}"><span>${n}</span><span class="tr"><i data-w="${v/mx*100}"></i></span><b>${v}</b></button>`}).join('');
 requestAnimationFrame(()=>document.querySelectorAll('#cats i').forEach(e=>e.style.width=e.dataset.w+'%'));
 if(tab==='open'){$('#list').innerHTML=`<div class="dash" style="margin:0"><div class="sr"><b>Before you open</b><span style="color:var(--gold);font-weight:800">${done}/${total}</span></div><div class="prog"><i style="width:${ready}%"></i></div><small style="color:var(--dim)">Things people often forget. Tick them off as you go. Check the papers with a local accountant or lawyer.</small></div>`+
  CHECK.map(([g,items])=>`<div class="group"><h3>${g}</h3>${items.map(([id,t,h])=>`<div class="chk${ck[id]?' on':''}" data-chk="${id}" role="checkbox" aria-checked="${!!ck[id]}" tabindex="0"><i>${ck[id]?'✓':''}</i><span>${esc(t)}${h?`<small>${esc(h)}</small>`:''}</span></div>`).join('')}</div>`).join('')+
  `<div class="group"><h3>Ideas you might have missed</h3>${MISSED.filter(([t])=>!L.some(i=>i.title===t)).map(([t,c])=>`<div class="miss"><span>${esc(t)}</span><button class="btn" data-miss="${esc(t)}" data-cat="${c}">+ Add</button></div>`).join('')||'<p class="empty">You added them all.</p>'}</div>`;newId=null;return}
 $('#slots').innerHTML=Array.from({length:MAX},(_,k)=>`<i class="slot${k<P.length?' on':''}"></i>`).join('');
 $('#picked').innerHTML=P.map(i=>`<span>${esc(i.title)}</span>`).join('');
 const show=(tab==='picked'?P:L).filter(i=>!catF||i.cat===catF).slice().sort((a,b)=>b.harvest-a.harvest||b.stars-a.stars||b.created-a.created);
 $('#list').innerHTML=show.map((i,k)=>{const open=openId===i.id;return `<article class="idea${i.harvest?' pk':''}${newId===i.id?' new':''}" data-id="${esc(i.id)}" style="animation-delay:${Math.min(k,10)*35}ms">
  <div class="row"><button class="title" data-open>${esc(i.title)}</button><button class="pick${i.harvest?' on':''}" data-pick aria-label="Pick">✓</button></div>
  ${open?`<div class="edit"><div class="catpick">${Object.entries(CATS).map(([k,[n,c]])=>`<button data-setcat="${k}" class="${i.cat===k?'on':''}" style="--c:${c}">${n}</button>`).join('')}</div><input class="in" data-f="title" value="${esc(i.title)}" aria-label="Title"><textarea class="in" data-f="note" placeholder="A few words about it…" aria-label="Note">${esc(i.note)}</textarea><div class="acts"><button class="btn red" data-del>Delete</button><button class="btn gold" data-open>Done</button></div></div>`:(i.note?`<p class="note" data-open>${esc(i.note)}</p>`:'')}
  <div class="sr"><span class="ctag" style="--c:${CATS[i.cat][1]}">${CATS[i.cat][0]}</span><div class="stars">${[1,2,3,4,5].map(n=>`<button data-star="${n}" class="${i.stars>=n?'on':''}" aria-label="${n} stars">★</button>`).join('')}</div></div></article>`}).join('')||`<p class="empty">${catF?'No ideas in this category yet.':tab==='picked'?'Nothing picked yet. Tap ✓ on your favourite ideas.':'No ideas yet. Drop your first one above.'}</p>`;
 newId=null;
}

/* toast */
let tT,tFn;function toast(m,btn,fn){$('#toastTxt').textContent=m;$('#toastBtn').textContent=btn||'OK';tFn=fn;$('#toast').classList.add('on');clearTimeout(tT);tT=setTimeout(()=>$('#toast').classList.remove('on'),4500)}

/* events */
$('#addForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#newIdea').value.trim();if(!v)return;const i={id:uid(),field:field().id,title:v,note:'',stars:3,cat:catF||guess(v),harvest:false,created:Date.now()};S.ideas.push(i);newId=i.id;setTab('all');$('#newIdea').value='';save();render()});
document.addEventListener('click',e=>{
 const t=e.target,card=t.closest('.idea'),i=card&&S.ideas.find(x=>x.id===card.dataset.id);
 const sc=t.closest('[data-setcat]');if(i&&sc){i.cat=sc.dataset.setcat;save();render();return}
 const cf=t.closest('[data-catf]');if(cf){catF=catF===cf.dataset.catf?'':cf.dataset.catf;if(tab==='open')setTab('all');render();return}
 const ch=t.closest('[data-chk]');if(ch){const f=field().id;S.checks[f]=S.checks[f]||{};S.checks[f][ch.dataset.chk]=!S.checks[f][ch.dataset.chk];save();render();return}
 const ms=t.closest('[data-miss]');if(ms){const n={id:uid(),field:field().id,title:ms.dataset.miss,note:'',stars:3,cat:ms.dataset.cat,harvest:false,created:Date.now()};S.ideas.push(n);save();render();toast('Added to your ideas.','See it',()=>{setTab('all');newId=n.id;render()});return}
 if(i&&t.closest('[data-star]')){const n=+t.closest('[data-star]').dataset.star;i.stars=i.stars===n?n-1:n;save();render();return}
 if(i&&t.closest('[data-pick]')){if(!i.harvest&&mine().filter(x=>x.harvest).length>=MAX){toast('You already picked 6. Unpick one first.');return}i.harvest=!i.harvest;save();render();return}
 if(i&&t.closest('[data-del]')){const k=S.ideas.indexOf(i);S.ideas.splice(k,1);openId=null;save();render();toast('Idea deleted.','Undo',()=>{S.ideas.splice(k,0,i);save();render()});return}
 if(i&&t.closest('[data-open]')){openId=openId===i.id?null:i.id;render();if(openId)document.querySelector(`.idea[data-id="${CSS.escape(i.id)}"] .in`)?.focus();return}
 const tb=t.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);render();return}
 if(t.closest('#toastBtn')){$('#toast').classList.remove('on');tFn&&tFn();return}
 if(t.closest('#cloudBtn')){$('#cloudTxt').textContent=ckey?'Connected. Your ideas sync between your devices.':'Enter your passcode to sync ideas between phone and laptop.';$('#sheet').classList.toggle('on');return}
 if(t.closest('#closeSheet')){$('#sheet').classList.remove('on');return}
 if(t.closest('#connect')){const v=$('#pass').value.trim();if(!v)return;ckey=v;setCloud('#efc56b');pull(true).then(r=>{if(r==='ok'){try{localStorage.setItem('orchard.key',v)}catch(e){}$('#pass').value='';$('#sheet').classList.remove('on');toast('Connected. Ideas now sync.')}else{ckey='';toast(r==='bad'?'Wrong passcode.':'Could not connect. Try again online.')}});return}
 if(t.closest('#logout')){ckey='';try{localStorage.removeItem('orchard.key')}catch(e){}setCloud('#73836f');$('#sheet').classList.remove('on');toast('Disconnected.');return}
 if(t.closest('#newBiz')){const f={id:uid(),name:'New business'};S.fields.push(f);S.cur=f.id;save();render();$('#sheet').classList.remove('on');renameBiz();return}
 if(t.closest('#delBiz')){if(S.fields.length<2){toast('Keep at least one business.');return}const snap=JSON.stringify(S),f=field();S.ideas=S.ideas.filter(x=>x.field!==f.id);S.fields=S.fields.filter(x=>x!==f);S.cur=S.fields[0].id;save();render();$('#sheet').classList.remove('on');toast(`Deleted “${f.name}”.`,'Undo',()=>{S=JSON.parse(snap);save();render()});return}
 if(t.closest('#name'))renameBiz();
});
function setTab(v){tab=v;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===v))}
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('[data-chk]');if(c&&(e.key===' '||e.key==='Enter')){e.preventDefault();c.click()}});
function renameBiz(){const h=$('#name');h.contentEditable='true';h.focus();const r=document.createRange();r.selectNodeContents(h);const s=getSelection();s.removeAllRanges();s.addRange(r)}
$('#name').addEventListener('blur',e=>{e.target.contentEditable='false';field().name=e.target.textContent.trim()||'My business';save();render()});
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});
$('#name').title='Tap to rename';
document.addEventListener('input',e=>{const t=e.target,card=t.closest('.idea');if(!card||!t.dataset.f)return;const i=S.ideas.find(x=>x.id===card.dataset.id);i[t.dataset.f]=t.value;if(t.dataset.f==='title')card.querySelector('.title').textContent=t.value;save()});
$('#biz').addEventListener('change',e=>{S.cur=e.target.value;openId=null;save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openId=null;$('#sheet').classList.remove('on');render()}});

/* background field */
function drawBg(){const c=$('#bg'),W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let s=4321;const r=()=>(s=s*16807%2147483647)/2147483647;
 x.fillStyle='#8c8668';x.fillRect(0,0,W,H);const pal=['#2d4620','#36552a','#3f5f2a','#2a401e','#4a6a2e','#5b6f33'];const bw=170,bh=136;
 for(let i=-1;i*bw<W+bw;i++)for(let j=-1;j*bh<H+bh;j++){const X=i*bw-(j%2)*30+7,Y=j*bh+7,w=bw-14,h=bh-14;x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();x.fillStyle=pal[Math.floor(r()*pal.length)];x.fillRect(X,Y,w,h);x.translate(X+w/2,Y+h/2);x.rotate([0,.78,-.78,1.57][Math.floor(r()*4)]);for(let t=-200;t<200;t+=6){x.fillStyle='rgba(12,24,10,.45)';x.fillRect(-200,t,400,1.6);x.fillStyle='rgba(170,210,110,.15)';x.fillRect(-200,t+2,400,1.2)}x.restore()}
 for(let i=0;i<W*H/9000;i++){const px=r()*W,py=r()*H,rad=8+r()*12,g=x.createRadialGradient(px-rad*.4,py-rad*.4,1,px,py,rad);g.addColorStop(0,'#9cc46a');g.addColorStop(1,'#2a4a1c');x.fillStyle=g;x.beginPath();x.arc(px,py,rad,0,7);x.fill()}}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawBg,200)});
drawBg();render();pull();
}
</script>
</body>
</html>
